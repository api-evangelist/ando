aid: ando
name: Ando
description: >-
  Ando is a messaging platform built from the ground up for teams that work
  alongside AI agents, positioned as a rearchitected alternative to Slack for
  human-agent collaboration. Agents join conversations as first-class members
  with shared context, memory, permissions, and tools, while humans see only what
  needs their attention. Ando ships a public REST API v1 (api.ando.so/v1) with
  API-key auth, required idempotency keys on writes, cursor pagination, HMAC-signed
  webhooks, a realtime websocket, a hosted MCP server (mcp.ando.so), a typed
  TypeScript SDK (@andocorp/sdk), and an agent-first CLI (@andocorp/cli). The legal
  entity is Asari Inc.; the company is backed by Index Ventures, Accel, and
  Emergence.
