    post:
      description: 'Creates a message in a conversation using the authenticated API-key workspace membership as the author. With send_at, the message is scheduled instead and the response is 202 with the scheduled message: it is sent at that time, through the same scheduling the app uses, only if the key is still live and its member can still post there. send_at must be at least 5 minutes and at most 30 days ahead (400 invalid_send_at otherwise); a key holds at most 100 waiting messages (409 scheduled_message_limit_reached). Thread replies schedule the same way.'
      operationId: createConversationMessage
      parameters:
      - description: Conversation identifier.
        in: path
        name: conversationId
        required: true
        schema:
          description: Conversation identifier.
          type: string
      - description: Required idempotency key for safely retrying this write.
        in: header
        name: Idempotency-Key
        required: true
