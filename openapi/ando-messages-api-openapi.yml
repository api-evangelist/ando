    CreateConversationMessageBody:
      additionalProperties: false
      description: Create a conversation message. The authenticated API-key workspace member is the author; author_id is accepted only for legacy body compatibility and is ignored.
      properties:
        app_card:
          oneOf:
          - additionalProperties: false
            description: A deployment attempt reported by the authenticated publisher. Markdown remains the fallback for clients without native cards.
            properties:
              kind:
                type: string
                enum:
                - deployment
              deployment:
                additionalProperties: false
                description: Immutable deployment result.
                properties:
                  repository:
                    description: GitHub owner/repository.
                    type: string
                    maxLength: 200
                    pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
                  sha:
                    description: Full commit SHA.
                    type: string
                    pattern: ^[a-fA-F0-9]{40}$
                  subject:
                    description: Commit subject.
                    type: string
                    maxLength: 300
                  environment:
                    description: Deployment environment.
                    type: string
                    minLength: 1
                    maxLength: 80
                  run_id:
                    description: GitHub Actions run ID.
                    type: string
                    pattern: ^[1-9][0-9]*$
                    maxLength: 30
                  run_attempt:
                    type: integer
                    minimum: 1
                  verification:
                    type: string
                    enum:
                    - success
                    - failure
                    - cancelled
                    - skipped
                    - unknown
                  services:
                    type: array
                    minItems: 1
                    maxItems: 12
                    items:
                      additionalProperties: false
                      description: One service outcome; names must be distinct.
                      properties:
                        name:
                          description: Service name.
                          type: string
                          minLength: 1
                          maxLength: 80
                        result:
                          type: string
                          enum:
                          - success
                          - failure
                          - cancelled
                          - skipped
                          - unknown
                      required:
                      - name
                      - result
                      type: object
                required:
                - repository
                - sha
                - subject
                - environment
                - run_id
                - run_attempt
                - verification
                - services
                type: object
            required:
            - kind
            - deployment
            type: object
          - additionalProperties: false
            description: A native report or visualization. The server validates the version-1 CardDocument and generates text fallback.
            properties:
              kind:
                type: string
                enum:
                - document
              document:
                $ref: '#/components/schemas/CardDocument'
            required:
            - kind
            - document
            type: object
        markdown_content:
          description: Message markdown content.
          type:
          - string
          - 'null'
        explicit_context_message_ids:
          description: Message identifiers to include as explicit context.
          items:
            description: Message identifier.
            type: string
          type: array
        image_urls:
          description: Image URLs to attach to the message.
          items:
            description: Image URL.
            type: string
            format: uri
          type: array
        file_ids:
          description: Ready file identifiers from the Files routes to attach to the message.
          items:
            description: File identifier.
            type: string
          type: array
        suppressed_link_preview_urls:
          description: 'URLs to send as plain links: no link preview and no app card.'
          items:
            description: URL.
            type: string
            format: uri
          type: array
        initiator_id:
          description: Initiating workspace member identifier.
          type:
          - string
          - 'null'
        thread_root_id:
          description: Thread root message identifier.
          type:
          - string
          - 'null'
        replied_to_message_id:
          description: Immediate parent message identifier inside an existing thread. For the first reply to a root message, send thread_root_id only; if replied_to_message_id equals thread_root_id, the server normalizes it as the first reply.
          type:
          - string
          - 'null'
        call_root_id:
          description: Call root identifier.
          type:
          - string
          - 'null'
        optimistic_id:
          description: Client optimistic identifier.
          type: string
        client_request_id:
          description: Legacy body idempotency value. Public v1 clients should use the Idempotency-Key header.
          type:
          - string
          - 'null'
        author_id:
          description: 'Ignored legacy body author workspace member identifier. Deprecated: the authenticated API-key workspace member is always the author.'
          type: string
          deprecated: true
        send_at:
          description: Send the message later instead of now. An ISO 8601 timestamp with a UTC offset, at least 5 minutes and at most 30 days ahead. The response is then 202 with a scheduled message. Cannot be combined with app_card or initiator_id.
          type: string
          example: '2026-10-12T09:00:00Z'
          format: date-time
      required:
      - markdown_content
      type: object
