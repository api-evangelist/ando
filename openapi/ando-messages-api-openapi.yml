      description: 'Version-1 declarative Ando card. Runtime also enforces global ID uniqueness, nesting <=6, <=1024 total blocks, <=512 KiB JSON, valid HTTP(S) URLs, table row widths, selected option membership, increasing chart times, matching series lengths and sufficient known measurements. Percentage charts use 0–100. Resources require a title unless loading=true. Any block may set platforms to show only there: native is the iOS and Android app, web is the browser and desktop app; omit it to show the block everywhere.'
