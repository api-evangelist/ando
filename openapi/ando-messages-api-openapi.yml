  /scheduled-messages/{scheduledMessageId}:
    delete:
      description: Cancels a message the calling API key scheduled, so it is never sent. Requires messages:write. A scheduled message that does not exist, was scheduled by another key or in the app, was already sent or was already canceled returns 404 Scheduled message not found, so repeating a cancel is safe and reveals nothing. To change a scheduled message, cancel it and schedule again.
      operationId: cancelScheduledMessage
      parameters:
      - description: Scheduled message identifier.
        in: path
        name: scheduledMessageId
        required: true
        schema:
          description: Scheduled message identifier.
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelScheduledMessageResponse'
          description: Canceled scheduled message.
        '400':
