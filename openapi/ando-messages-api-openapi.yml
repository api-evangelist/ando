                  - canceled
              required:
              - canceled_at
              - id
              - status
              type: object
          required:
          - scheduled_message
          type: object
      required:
      - data
      type: object
    MessageForwardSource:
      additionalProperties: false
      description: What a forwarded message carries from its source. Present only on forwarded messages; absent on older deployments. A show_message forward shares the snapshot captured at forward time with every reader of the forwarded message. A link_only forward shares no source content. Source identifiers are present only when the reader can open the source conversation.
      properties:
        call_id:
          description: Call explicitly shared by this destination message. Pass the destination message ID as forwarded_message_id to call reads.
          type: string
        author_id:
          description: Source author workspace membership identifier. Null for link_only forwards.
          type:
          - string
          - 'null'
        author_name:
          description: Source author display name at forward time. Null for link_only forwards.
          type:
          - string
          - 'null'
        can_open_source:
          description: Whether the reader can open the source conversation.
          type: boolean
        content:
          description: Source message markdown captured at forward time. Null for link_only forwards.
          type:
          - string
          - 'null'
        file_names:
          description: Names of files attached to the source message at forward time. Empty for link_only forwards.
          items:
            description: Attachment filename.
            type: string
          type: array
        is_thread_reply:
          description: Whether the source message is a thread reply.
          type: boolean
        share_mode:
          description: What the forwarder chose to share.
          enum:
          - show_message
          - link_only
          type: string
        source_conversation_id:
          description: Source conversation identifier. Null unless the reader can open the source.
          type:
          - string
          - 'null'
        source_conversation_name:
          description: Current source conversation name. Null unless the reader can open the source.
          type:
          - string
          - 'null'
        source_created_at:
          description: Source message creation timestamp.
          type: string
          example: '2026-05-14T08:00:00.000Z'
          format: date-time
        source_kind:
          description: Kind of source message.
          enum:
          - message
          - jam_call_card
          type: string
        source_message_id:
          description: Source message identifier. Null unless the reader can open the source.
          type:
          - string
          - 'null'
        source_subtitle:
          description: 'Where the source was posted, captured at forward time: #channel-name, a channel, a direct message, or a group DM. A reader who cannot open a channel source gets "a private channel" instead of its name. Null for link_only forwards.'
          type:
          - string
          - 'null'
        source_thread_root_id:
          description: Source thread root identifier for thread replies. Null unless the reader can open the source.
          type:
          - string
          - 'null'
      required:
      - share_mode
      - source_kind
      - can_open_source
      - source_message_id
      - source_conversation_id
      - source_thread_root_id
      - source_conversation_name
      - source_subtitle
      - source_created_at
      - is_thread_reply
      - author_id
      - author_name
      - content
      - file_names
      type: object
    LegacyErrorResponse:
      additionalProperties: false
      description: Current compatibility error envelope used by legacy /api/v1 routes.
      properties:
        error:
          description: Error message.
          type: string
        error_code:
          description: Optional machine-readable error code.
          type:
          - string
          - 'null'
        type:
          description: 'Error class, one per HTTP status family. rate_limit_error, api_error, overloaded_error and timeout_error are worth retrying; the others need a different request. Retry a write only with the same Idempotency-Key: an api_error can mean it committed.'
          enum:
          - invalid_request_error
          - authentication_error
          - permission_error
          - not_found_error
          - conflict_error
          - request_too_large
          - rate_limit_error
          - api_error
          - overloaded_error
          - timeout_error
          type: string
        request_id:
          description: The request id, also sent as the x-request-id header. Quote it when reporting a problem.
          type: string
        missing_scopes:
          description: Missing scopes.
          items:
            description: Scope.
            type: string
          type: array
      required:
      - error
      type: object
