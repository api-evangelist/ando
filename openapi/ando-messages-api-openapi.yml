      description: A message the calling API key scheduled that is still waiting to send. Only that key can see or cancel it.
      properties:
        conversation_id:
          description: Conversation the message will be sent to.
          type: string
          example: 01jzn7e61x3a7v9h2r7t2m3q4p
        created_at:
          description: When the message was scheduled.
          type: string
          example: '2026-05-14T08:00:00.000Z'
          format: date-time
        file_ids:
          description: Attached file identifiers.
          items:
            description: File identifier.
            type: string
          type: array
        id:
          description: Scheduled message identifier.
          type: string
          example: 01jzn7e61x3a7v9h2r7t2m3q4p
        markdown_content:
          description: Message body.
          type: string
        replied_to_message_id:
          description: Immediate parent message inside the thread, if any.
          type:
          - string
          - 'null'
        send_at:
          description: When the message will be sent.
          type: string
          example: '2026-05-14T08:00:00.000Z'
          format: date-time
        status:
          type: string
          enum:
          - scheduled
        thread_root_id:
          description: Thread root message identifier for a scheduled thread reply.
          type:
          - string
          - 'null'
      required:
      - conversation_id
      - created_at
      - file_ids
      - id
      - markdown_content
      - replied_to_message_id
      - send_at
      - status
      - thread_root_id
