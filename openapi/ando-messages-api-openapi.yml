  /conversation-messages/{messageId}/replies:
    get:
      description: Returns replies for a thread root message in chronological order. Requires messages:read and access to the conversation. Use before to fetch the nearest preceding replies, or after to page forward; the two cursors are mutually exclusive.
      operationId: listThreadReplies
      parameters:
      - description: Thread root message identifier.
        in: path
        name: messageId
        required: true
        schema:
          description: Thread root message identifier.
          type: string
      - description: Maximum number of records to return.
        in: query
        name: limit
        schema:
          description: Maximum number of records to return.
          type: integer
          minimum: 1
      - description: Cursor or ISO timestamp after which results should be returned.
        in: query
        name: after
        schema:
          description: Cursor or ISO timestamp after which results should be returned.
          type: string
      - description: Opaque cursor identifying a reply in this thread. Returns the nearest earlier replies; mutually exclusive with after.
        in: query
        name: before
        schema:
          type: string
          description: Opaque cursor identifying a reply in this thread.
      responses:
        '200':
          content:
            application/json:
              examples:
                replies:
                  summary: Thread replies.
                  value:
                    data:
                      thread_root_id: msg_01jzn7e61x3a7v9h2r7t2m3q4p
                      conversation_id: conv_01jzn7e61x3a7v9h2r7t2m3q4p
                      conversation_name: Launch planning
