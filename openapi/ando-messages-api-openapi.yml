openapi: 3.2.0
info:
  description: Generated from Ando's accepted public API v1 contract metadata. Current routes preserve legacy /api/v1 response envelopes while converging on the public https://api.ando.so/v1 shape.
  title: Ando Public Messages API
  version: v1
servers:
- description: Canonical public API host.
  url: https://api.ando.so/v1
tags:
- description: Message and conversation message routes.
  name: Messages
paths:
  /conversation-messages/{messageId}:
    get:
      description: Returns a single conversation message by identifier. Requires messages:read and access to the conversation.
      operationId: getConversationMessage
      parameters:
      - description: Message identifier.
        in: path
        name: messageId
        required: true
        schema:
          description: Message identifier.
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                message:
                  summary: Message details.
                  value:
                    id: msg_01jzn7e61x3a7v9h2r7t2m3q4p
                    conversation_id: conv_01jzn7e61x3a7v9h2r7t2m3q4p
                    conversation_name: Launch planning
                    authorWorkspaceMembershipId: mem_01jzn7e61x3a7v9h2r7t2m3q4p
                    author_id: mem_01jzn7e61x3a7v9h2r7t2m3q4p
                    author_name: Alex Kim
                    content: Validated the route migration.
                    image_urls: []
                    attachments: []
                    reactions:
                    - emoji_text: ':thumbsup:'
                      count: 2
                    replies_count: 1
                    created_at: '2026-05-14T08:00:00.000Z'
                    data:
                      id: msg_01jzn7e61x3a7v9h2r7t2m3q4p
                      conversation_id: conv_01jzn7e61x3a7v9h2r7t2m3q4p
                      conversation_name: Launch planning
                      authorWorkspaceMembershipId: mem_01jzn7e61x3a7v9h2r7t2m3q4p
                      author_id: mem_01jzn7e61x3a7v9h2r7t2m3q4p
                      author_name: Alex Kim
                      content: Validated the route migration.
                      image_urls: []
                      attachments: []
                      reactions:
                      - emoji_text: ':thumbsup:'
                        count: 2
                      replies_count: 1
                      created_at: '2026-05-14T08:00:00.000Z'
              schema:
                $ref: '#/components/schemas/MessageResultResponse'
          description: Message details.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - AndoApiKey: []
      - BearerApiKey: []
      summary: Get a message
      tags:
      - Messages
      x-ando-compatibility-mode: standard_public
      x-ando-migration-target: standard_public
      x-ando-rate-limit-policy: declared
      x-ando-route-id: api.api_v1_conversation_messages_by_messageid.get
      x-ando-canonical-host: api.ando.so
      x-ando-documentation-owner: api_platform
      x-ando-principal-kind: workspace_api_key
      x-ando-public-api-route-class: public_data
      x-ando-public-path: /v1/conversation-messages/:messageId
      x-ando-runtime-owner: api_platform
      x-ando-status-probe-owner: public_api_messaging
      x-ando-rollback-runtime: express
      x-ando-selected-runtime: convex_http
      x-ando-target-runtime: convex_http
    patch:
      description: 'Replaces the markdown body of a message authored by the authenticated API-key workspace membership. Each accepted edit marks the message as edited and emits a message.updated ProductEvent to webhook and realtime subscribers. A message posted with a document card can replace that card by sending app_card; the server regenerates its text fallback. Attachments, thread placement, and authorship are fixed at create time and are not editable, and a message without a document card cannot gain one. Sending a body identical to the stored one is a no-op: the message keeps its revision and no event is emitted. Editing does not create new mentions or notifications.'
      operationId: updateConversationMessage
      parameters:
      - description: Message identifier.
        in: path
        name: messageId
        required: true
        schema:
          description: Message identifier.
          type: string
      requestBody:
        content:
          application/json:
            examples:
              progress:
                summary: Repaint a message with run progress.
                value:
                  markdown_content: 'Step 3 of 5: running the migration test suite…'
            schema:
              $ref: '#/components/schemas/UpdateConversationMessageBody'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                message:
                  summary: Updated message.
                  value:
                    id: msg_01jzn7e61x3a7v9h2r7t2m3q4p
                    conversation_id: conv_01jzn7e61x3a7v9h2r7t2m3q4p
                    conversation_name: Launch planning
                    authorWorkspaceMembershipId: mem_01jzn7e61x3a7v9h2r7t2m3q4p
                    author_id: mem_01jzn7e61x3a7v9h2r7t2m3q4p
                    author_name: Alex Kim
                    content: 'Step 3 of 5: running the migration test suite…'
                    image_urls: []
                    attachments: []
                    reactions:
                    - emoji_text: ':thumbsup:'
                      count: 2
                    replies_count: 1
                    created_at: '2026-05-14T08:00:00.000Z'
                    data:
                      id: msg_01jzn7e61x3a7v9h2r7t2m3q4p
                      conversation_id: conv_01jzn7e61x3a7v9h2r7t2m3q4p
                      conversation_name: Launch planning
                      authorWorkspaceMembershipId: mem_01jzn7e61x3a7v9h2r7t2m3q4p
                      author_id: mem_01jzn7e61x3a7v9h2r7t2m3q4p
                      author_name: Alex Kim
                      content: 'Step 3 of 5: running the migration test suite…'
                      image_urls: []
                      attachments: []
                      reactions:
                      - emoji_text: ':thumbsup:'
                        count: 2
                      replies_count: 1
                      created_at: '2026-05-14T08:00:00.000Z'
              schema:
                $ref: '#/components/schemas/MessageResultResponse'
          description: Updated message.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - AndoApiKey: []
      - BearerApiKey: []
      summary: Update a message
      tags:
      - Messages
      x-ando-compatibility-mode: standard_public
      x-ando-migration-target: standard_public
      x-ando-rate-limit-policy: declared
      x-ando-route-id: api.api_v1_conversation_messages_by_messageid.patch
      x-ando-canonical-host: api.ando.so
      x-ando-documentation-owner: api_platform
      x-ando-principal-kind: workspace_api_key
      x-ando-public-api-route-class: durable_ingress
      x-ando-public-path: /v1/conversation-messages/:messageId
      x-ando-runtime-owner: convex_product
      x-ando-status-probe-owner: public_api_messaging
      x-ando-rollback-runtime: convex_http
      x-ando-selected-runtime: convex_http
      x-ando-target-runtime: convex_http
    delete:
      description: 'Deletes a message authored by the authenticated API-key workspace membership, exactly as its author deleting it in the app: the message is removed for everyone, its body, attachments and reactions are cleared, and replies under a thread root stay in their thread. Requires messages:write. A message that does not exist, is not visible to the key, was authored by someone else, or is already deleted returns 404 Message not found, so repeating a delete is safe and reveals nothing. No webhook event is emitted.'
      operationId: deleteConversationMessage
      parameters:
      - description: Message identifier.
        in: path
        name: messageId
        required: true
        schema:
          description: Message identifier.
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteConversationMessageResponse'
          description: Deleted message.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - AndoApiKey: []
      - BearerApiKey: []
      summary: Delete a message
      tags:
      - Messages
      x-ando-compatibility-mode: standard_public
      x-ando-migration-target: standard_public
      x-ando-rate-limit-policy: declared
      x-ando-route-id: api.api_v1_conversation_messages_by_messageid.delete
