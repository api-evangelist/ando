  /scheduled-messages:
    get:
      description: Lists the messages the calling API key scheduled that are still waiting to send, soonest first. Requires messages:write. Messages scheduled by other keys or in the app are never listed; sent and canceled messages drop out.
      operationId: listScheduledMessages
      parameters:
      - description: Opaque cursor returned by data.page_info.next_cursor. Omit for the first page.
        in: query
        name: cursor
        schema:
          description: Opaque cursor returned by data.page_info.next_cursor. Omit for the first page.
          type: string
      - description: Maximum scheduled messages to return. Defaults to 50.
        in: query
        name: limit
        schema:
          description: Maximum scheduled messages to return. Defaults to 50.
          type: integer
          maximum: 100
          minimum: 1
      responses:
        '200':
          content:
            application/json:
              examples:
                scheduled:
                  summary: One waiting message.
                  value:
                    data:
                      items:
                      - conversation_id: 01jzn7e61x3a7v9h2r7t2m3q4p
                        created_at: '2026-10-11T16:00:00.000Z'
                        file_ids: []
                        id: 4f1d2c3b-5a6e-4f70-8a9b-0c1d2e3f4a5b
                        markdown_content: Release notes for 4.2 are live.
                        replied_to_message_id: null
                        send_at: '2026-10-12T09:00:00.000Z'
                        status: scheduled
                        thread_root_id: null
                      page_info:
                        has_next_page: false
                        next_cursor: null
              schema:
                $ref: '#/components/schemas/ScheduledMessageListResponse'
          description: Waiting scheduled messages.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - AndoApiKey: []
      - BearerApiKey: []
      summary: List scheduled messages
      tags:
      - Messages
      x-ando-compatibility-mode: standard_public
      x-ando-migration-target: standard_public
      x-ando-rate-limit-policy: declared
      x-ando-route-id: api.api_v1_scheduled_messages.get
