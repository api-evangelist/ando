      properties:
        data:
          additionalProperties: false
          description: Canceled scheduled message data.
          properties:
            scheduled_message:
              additionalProperties: false
              description: The scheduled message that will no longer be sent.
              properties:
                canceled_at:
                  description: When the message was canceled.
                  type: string
                  example: '2026-05-14T08:00:00.000Z'
                  format: date-time
                id:
                  description: Scheduled message identifier.
                  type: string
                  example: 01jzn7e61x3a7v9h2r7t2m3q4p
