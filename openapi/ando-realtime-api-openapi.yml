openapi: 3.2.0
info:
  description: Generated from Ando's accepted public API v1 contract metadata. Current routes preserve legacy /api/v1 response envelopes while converging on the public https://api.ando.so/v1 shape.
  title: Ando Public Realtime API
  version: v1
servers:
- description: Canonical public API host.
  url: https://api.ando.so/v1
tags:
- description: Public realtime connection and protocol routes.
  name: Realtime
paths:
  /realtime/connections:
    post:
      description: Opens a temporary pre-authorized public realtime websocket connection URL for RFC 085 ProductEvent delivery. API keys are validated only on this HTTP route; the websocket uses the returned temporary ticket URL and the ando.realtime.v1 subprotocol.
      operationId: openRealtimeConnection
      requestBody:
        content:
          application/json:
            examples:
              messageCreatedEvents:
                summary: Subscribe to message.created events readable by the authenticated principal.
                value:
                  subscriptions:
                  - target: self
                    delivery: messages
                    events:
                    - message.created
            schema:
              $ref: '#/components/schemas/OpenRealtimeConnectionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              examples:
                connection:
                  summary: Temporary realtime connection URL.
                  value:
                    url: wss://realtime.ando.so/link?ticket=rtconn_opaque_temporary_ticket
                    expires_at: '2026-05-29T01:00:00.000Z'
                    expires_in_seconds: 60
                    connection_id: rtconn_01jzn7e61x3a7v9h2r7t2m3q4p
                    protocol: ando.realtime.v1
                    heartbeat_interval_seconds: 30
                    approximate_connection_time_seconds: null
                    resume_supported: true
                    resume_cursor: rtcur_v2_initial_01jzn7e61x3a7v9h2r7t2m3q4p
                    subscription_source: explicit
                    effective_wake_policy: null
                    subscriptions:
                    - id: rtsub_01jzn7e61x3a7v9h2r7t2m3q4p
                      target:
                        type: workspace_membership
                        id: mem_01jzn7e61x3a7v9h2r7t2m3q4p
                      delivery: messages
                      events:
                      - message.created
              schema:
                $ref: '#/components/schemas/OpenRealtimeConnectionResponse'
          description: Opened temporary realtime connection.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          content:
            application/json:
              examples:
                realtimeUnavailable:
                  summary: Realtime unavailable.
                  value:
                    error:
                      code: realtime_unavailable
                      message: Public realtime connection opening is not available yet.
              schema:
                $ref: '#/components/schemas/PublicApiErrorResponse'
          description: Public realtime connection opening is not available in this deployment.
      security:
      - AndoApiKey: []
      - BearerApiKey: []
      summary: Open a realtime connection
      tags:
      - Realtime
      x-ando-compatibility-mode: standard_public
      x-ando-migration-target: standard_public
      x-ando-rate-limit-policy: declared
      x-ando-route-id: api.api_v1_realtime_connections.post
      x-ando-required: true
      x-ando-canonical-host: api.ando.so
      x-ando-documentation-owner: api_platform
      x-ando-principal-kind: workspace_api_key
      x-ando-public-api-route-class: runtime_boundary
      x-ando-public-path: /v1/realtime/connections
      x-ando-runtime-owner: backend_runtime
      x-ando-status-probe-owner: none
      x-ando-rollback-runtime: express
      x-ando-selected-runtime: express
      x-ando-target-runtime: express
components:
  responses:
    RateLimited:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PublicApiErrorResponse'
      description: Rate limit or quota exceeded.
    InternalError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyErrorResponse'
      description: Internal server error.
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyErrorResponse'
      description: Missing or invalid API key.
    Conflict:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyErrorResponse'
      description: Conflict.
    Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyErrorResponse'
      description: Forbidden.
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyErrorResponse'
      description: Not found.
    BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LegacyErrorResponse'
      description: Bad request.
  schemas:
    LegacyErrorResponse:
      additionalProperties: false
      description: Current compatibility error envelope used by legacy /api/v1 routes.
      properties:
        error:
          description: Error message.
          type: string
        error_code:
          description: Optional machine-readable error code.
          type:
          - string
          - 'null'
        type:
          description: 'Error class, one per HTTP status family. rate_limit_error, api_error, overloaded_error and timeout_error are worth retrying; the others need a different request. Retry a write only with the same Idempotency-Key: an api_error can mean it committed.'
          enum:
          - invalid_request_error
          - authentication_error
          - permission_error
          - not_found_error
          - conflict_error
          - request_too_large
          - rate_limit_error
          - api_error
          - overloaded_error
          - timeout_error
          type: string
        request_id:
          description: The request id, also sent as the x-request-id header. Quote it when reporting a problem.
          type: string
        missing_scopes:
          description: Missing scopes.
          items:
            description: Scope.
            type: string
          type: array
      required:
      - error
      type: object
    RealtimeObjectTarget:
      additionalProperties: false
      description: Canonical realtime target resolved by the API. The initial release returns workspace membership targets only.
      properties:
        id:
          description: Target identifier.
          type: string
          example: 01jzn7e61x3a7v9h2r7t2m3q4p
        type:
          description: Target type.
          enum:
          - workspace_membership
          type: string
      required:
      - type
      - id
      type: object
    RealtimeEventType:
      description: ProductEvent type available on public realtime sockets.
      enum:
      - message.created
      - message.updated
      - message.reaction.created
      type: string
    RealtimeConnectionSubscriptionRequest:
      additionalProperties: false
      description: Realtime subscription requested while opening a connection.
      properties:
        delivery:
          $ref: '#/components/schemas/RealtimeDelivery'
        events:
          description: ProductEvent types requested for this subscription.
          items:
            $ref: '#/components/schemas/RealtimeEventType'
          type: array
          minItems: 0
          maxItems: 3
          uniqueItems: true
        target:
          $ref: '#/components/schemas/RealtimeTarget'
      required:
      - target
      - delivery
      - events
      type: object
      oneOf:
      - properties:
          delivery:
            enum:
            - messages
          events:
            minItems: 1
      - properties:
          delivery:
            enum:
            - inbox
          events:
            maxItems: 0
    RealtimeResumeRequest:
      additionalProperties: false
      description: Bounded realtime resume request.
      properties:
        cursor:
          description: Last acknowledged realtime cursor.
          type: string
          minLength: 1
          maxLength: 4096
      required:
      - cursor
      type: object
    RealtimeTarget:
      description: Realtime target requested while opening a connection. The initial release supports self or an explicit workspace membership target.
      oneOf:
      - description: Authenticated principal shorthand.
        enum:
        - self
        type: string
      - additionalProperties: false
        description: Workspace membership realtime target.
        properties:
          id:
            description: Workspace membership identifier.
            type: string
            example: 01jzn7e61x3a7v9h2r7t2m3q4p
          type:
            description: Target type.
            enum:
            - workspace_membership
            type: string
        required:
        - type
        - id
        type: object
    RealtimeConnectionSubscription:
      additionalProperties: false
      description: Canonical realtime subscription authorized by the API.
      properties:
        delivery:
          $ref: '#/components/schemas/RealtimeDelivery'
        events:
          description: ProductEvent types delivered on this subscription.
          items:
            $ref: '#/components/schemas/RealtimeEventType'
          type: array
          minItems: 0
          maxItems: 3
          uniqueItems: true
        id:
          description: Realtime subscription identifier.
          type: string
          example: 01jzn7e61x3a7v9h2r7t2m3q4p
        target:
          $ref: '#/components/schemas/RealtimeObjectTarget'
      required:
      - id
      - target
      - delivery
      - events
      type: object
      oneOf:
      - properties:
          delivery:
            enum:
            - messages
          events:
            minItems: 1
      - properties:
          delivery:
            enum:
            - inbox
          events:
            maxItems: 0
    PublicApiErrorResponse:
      additionalProperties: false
      description: Target public API error envelope.
      properties:
        error:
          additionalProperties: false
          description: Error details.
          properties:
            code:
              description: Machine-readable error code.
              type: string
            message:
              description: Human-readable error message.
              type: string
            request_id:
              description: Request identifier.
              type:
              - string
              - 'null'
          required:
          - code
          - message
          type: object
      required:
      - error
      type: object
    OpenRealtimeConnectionRequest:
      additionalProperties: false
      description: Public realtime connection-opening request.
      properties:
        resume_from:
          $ref: '#/components/schemas/RealtimeResumeRequest'
        subscriptions:
          description: Realtime subscriptions to authorize for this connection.
          items:
            $ref: '#/components/schemas/RealtimeConnectionSubscriptionRequest'
          type: array
          minItems: 1
          maxItems: 1
      type: object
    RealtimeDelivery:
      description: Realtime delivery filter. "messages" delivers readable conversation-scoped ProductEvents; "inbox" delivers agent pending-work snapshots with an empty events array.
      enum:
      - messages
      - inbox
      type: string
    OpenRealtimeConnectionResponse:
      additionalProperties: false
      description: Temporary public realtime websocket connection details.
      properties:
        approximate_connection_time_seconds:
          description: Approximate maximum connection lifetime in seconds. Resume near a cursor deadline can shorten it.
          type:
          - number
          - 'null'
        connection_id:
          description: Realtime connection identifier.
          type: string
          example: 01jzn7e61x3a7v9h2r7t2m3q4p
        expires_at:
          description: Timestamp when the returned connection URL expires if unused. Resume near a cursor deadline can shorten the normal URL lifetime.
          type: string
          example: '2026-05-14T08:00:00.000Z'
          format: date-time
        expires_in_seconds:
          description: Seconds until the returned connection URL expires if unused, capped by any resume-cursor deadline.
          type: integer
          minimum: 1
        heartbeat_interval_seconds:
          description: Recommended heartbeat interval for the socket.
          type: integer
          minimum: 1
        protocol:
          description: Required websocket subprotocol.
          enum:
          - ando.realtime.v1
          type: string
        resume_supported:
          description: Whether bounded resume is supported for this connection.
          type: boolean
        resume_cursor:
          description: Safe cursor for the connection's initial ledger floor. Persist it before opening the websocket, then replace it only after the server confirms an ordered acknowledgement or sends a planned-disconnect checkpoint.
          type: string
          minLength: 1
          maxLength: 4096
        subscription_source:
          description: Whether the canonical subscription was explicit or synthesized from external-agent Notify.
          enum:
          - explicit
          - agent_wake
          type: string
        effective_wake_policy:
          description: Current external-agent Notify ceiling. Null for a human member principal.
          enum:
          - mentions_and_direct_messages
          - mentions_only
          - all_messages
          - disabled
          type:
          - string
          - 'null'
        subscriptions:
          description: Canonical subscriptions authorized for the socket.
          items:
            $ref: '#/components/schemas/RealtimeConnectionSubscription'
          type: array
          minItems: 1
          maxItems: 1
        url:
          description: Temporary pre-authorized websocket URL. Treat the ticket query parameter as secret.
          type: string
      required:
      - url
      - expires_at
      - expires_in_seconds
      - connection_id
      - protocol
      - heartbeat_interval_seconds
      - approximate_connection_time_seconds
      - resume_supported
      - resume_cursor
      - subscription_source
      - effective_wake_policy
      - subscriptions
      type: object
  securitySchemes:
    AndoApiKey:
      description: Workspace API key. Current accepted keys use the ando_sk_ prefix.
      in: header
      name: x-api-key
      type: apiKey
    BearerApiKey:
      bearerFormat: ando_sk
      description: Compatibility transport for workspace API keys.
      scheme: bearer
      type: http
